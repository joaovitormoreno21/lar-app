<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma — App Lar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#3B82F6;--blue-d:#1D4ED8;--blue-l:#DBEAFE;
  --green:#10B981;--green-l:#D1FAE5;--green-d:#065F46;
  --yellow:#F59E0B;--yellow-l:#FEF3C7;
  --pink:#F472B6;--pink-d:#BE185D;--pink-l:#FCE7F3;
  --red:#EF4444;--red-l:#FEE2E2;--red-d:#991B1B;
  --purple:#A855F7;--purple-l:#F3E8FF;
  --orange:#FB923C;--orange-l:#FFEDD5;
  --ink:#0F172A;--ink-mid:#475569;--ink-light:#94A3B8;
  --border:#E2E8F0;--bg:#F0F7FF;--white:#fff;
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:0 0 60px;}

/* ── HEADER ── */
.top-bar{background:var(--blue);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 0 var(--blue-d);}
.top-title{font-size:20px;font-weight:900;color:white;}
.top-sub{font-size:12px;color:rgba(255,255,255,0.75);font-weight:600;margin-top:2px;}
.online-count{background:rgba(255,255,255,0.2);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:800;color:white;}

/* ── WHO AM I ── */
.who-bar{background:white;border-bottom:2px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px;}
.who-label{font-size:13px;font-weight:700;color:var(--ink-mid);}
.who-input{border:2px solid var(--border);border-radius:10px;padding:8px 12px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:var(--ink);outline:none;flex:1;max-width:200px;}
.who-input:focus{border-color:var(--blue);}
.who-btn{background:var(--blue);color:white;border:none;border-radius:10px;padding:8px 16px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--blue-d);}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px;}
.stat{background:white;border-radius:14px;border:2px solid var(--border);padding:14px;text-align:center;}
.stat-val{font-size:22px;font-weight:900;color:var(--blue);}
.stat-lbl{font-size:10px;font-weight:800;color:var(--ink-light);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;}

/* ── PROGRESS ── */
.prog-wrap{margin:0 16px 16px;background:white;border-radius:14px;border:2px solid var(--border);padding:14px 16px;}
.prog-label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink-mid);margin-bottom:8px;}
.prog-track{background:var(--blue-l);border-radius:20px;height:12px;overflow:hidden;}
.prog-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--pink));transition:width 0.5s ease;}

/* ── PHASES ── */
.phase{margin:0 16px 14px;background:white;border-radius:18px;border:2px solid var(--border);overflow:hidden;}
.phase-hdr{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.phase-hdr:hover{background:#FAFAFA;}
.ph-num{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:white;flex-shrink:0;}
.ph-info{flex:1;}
.ph-title{font-size:14px;font-weight:800;color:var(--ink);}
.ph-period{font-size:11px;font-weight:600;color:var(--ink-light);margin-top:1px;}
.ph-tag{font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;flex-shrink:0;}
.ph-arrow{color:var(--ink-light);font-size:18px;transition:transform 0.2s;flex-shrink:0;}
.ph-arrow.open{transform:rotate(90deg);}
.phase-body{display:none;border-top:2px solid var(--border);}
.phase-body.open{display:block;}

/* ── WEEKS ── */
.week{padding:12px 16px;border-bottom:2px dashed #F1F5F9;}
.week:last-child{border-bottom:none;}
.week-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.week-lbl{font-size:11px;font-weight:900;color:var(--ink-light);text-transform:uppercase;letter-spacing:0.05em;}
.week-date{font-size:11px;font-weight:600;color:#CBD5E1;}

/* ── TASKS ── */
.task{background:#F8FAFC;border:2px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;}
.task:last-child{margin-bottom:0;}
.task-row{display:flex;align-items:flex-start;gap:10px;}
.t-chk{width:24px;height:24px;border-radius:7px;border:3px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all 0.15s;background:white;margin-top:1px;}
.t-chk.done{background:var(--green);border-color:var(--green);color:white;}
.t-main{flex:1;}
.t-name{font-size:14px;font-weight:700;color:var(--ink);}
.t-name.done{text-decoration:line-through;color:var(--ink-light);}
.t-detail{font-size:12px;font-weight:600;color:var(--ink-light);margin-top:2px;line-height:1.4;}
.t-tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;margin-top:4px;display:inline-block;}
.t-meta{font-size:11px;font-weight:700;color:var(--ink-light);margin-top:6px;display:flex;align-items:center;gap:6px;}
.t-who-badge{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800;}

/* ── COMMENTS / BUGS ── */
.task-footer{border-top:2px dashed #F1F5F9;margin-top:10px;padding-top:10px;}
.comments-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.comment{background:white;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;color:var(--ink);border:2px solid var(--border);}
.comment-author{font-size:10px;font-weight:800;color:var(--blue);margin-bottom:2px;}
.comment-del{float:right;background:none;border:none;color:var(--ink-light);cursor:pointer;font-size:14px;line-height:1;}
.add-comment{display:flex;gap:6px;}
.comment-input{flex:1;border:2px solid var(--border);border-radius:8px;padding:7px 10px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:600;color:var(--ink);outline:none;resize:none;}
.comment-input:focus{border-color:var(--blue);}
.comment-btn{background:var(--blue);color:white;border:none;border-radius:8px;padding:7px 12px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;}

/* ── ADD TASK ── */
.add-task-wrap{padding:10px 16px;border-top:2px dashed var(--border);}
.add-task-btn{width:100%;background:var(--blue-l);color:var(--blue-d);border:2px dashed var(--blue);border-radius:10px;padding:10px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;}
.add-task-form{background:var(--blue-l);border-radius:10px;padding:12px;border:2px solid var(--blue);}
.add-task-form input,.add-task-form textarea{width:100%;border:2px solid var(--border);border-radius:8px;padding:9px 12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;color:var(--ink);outline:none;margin-bottom:8px;background:white;}
.add-task-form textarea{resize:vertical;height:60px;}
.add-form-row{display:flex;gap:8px;}
.add-form-row select{flex:1;border:2px solid var(--border);border-radius:8px;padding:9px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;color:var(--ink);outline:none;background:white;}
.btn-save-task{background:var(--blue);color:white;border:none;border-radius:8px;padding:10px 18px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;}
.btn-cancel-task{background:white;color:var(--ink-mid);border:2px solid var(--border);border-radius:8px;padding:10px 14px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}

/* ── TOAST ── */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--ink);color:white;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:800;z-index:200;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>

      <div class="phase-body ${ph.open?'open':''}" id="body-${ph.id}">
        ${weeksHtml}
        ${extraTasks ? `<div class="week"><div class="week-hdr"><span class="week-lbl">Adicionadas pelo time</span></div>${extraTasks}</div>` : ''}
        <div class="add-task-wrap">
          <button class="add-task-btn" onclick="showAddTask('${ph.id}')">+ Adicionar tarefa ou bug</button>
          <div class="add-task-form" id="add-form-${ph.id}" style="display:none;margin-top:8px;">
            <input type="text" id="new-task-name-${ph.id}" placeholder="Nome da tarefa ou bug...">
            <textarea id="new-task-detail-${ph.id}" placeholder="Detalhe, contexto, como reproduzir..."></textarea>
            <div class="add-form-row">
              <select id="new-task-tag-${ph.id}">
                <option value="Bug">🐛 Bug</option>
                <option value="Dev">💻 Dev</option>
                <option value="Teste">✅ Teste</option>
                <option value="Gestão">📋 Gestão</option>
                <option value="Ideia">💡 Ideia</option>
              </select>
              <button class="btn-save-task" onclick="addTask('${ph.id}')">Salvar</button>
              <button class="btn-cancel-task" onclick="hideAddTask('${ph.id}')">Cancelar</button>
            </div>
          </div>
        </div>
      </div>`;
    container.appendChild(phEl);
    restoreTaskStates(ph);
  });
  updateStats();
}

function renderTask(t, phaseId) {
  const d = allData[t.id] || {};
  const done = d.done || false;
  const doneBy = d.doneBy || '';
  const comments = d.comments || {};
  const commentCount = Object.keys(comments).length;
  let commentsHtml = Object.entries(comments).map(([cid, c]) => `
    <div class="comment">
      <div class="comment-author">${c.author} · ${c.when}</div>
      ${c.text}
      ${c.author === userName ? `<button class="comment-del" onclick="delComment('${t.id}','${cid}')">×</button>` : ''}
    </div>`).join('');
  return `
    <div class="task" id="task-${t.id}">
      <div class="task-row">
        <div class="t-chk ${done?'done':''}" onclick="toggleTask('${t.id}')">${done?'✓':''}</div>
        <div class="t-main">
          <div class="t-name ${done?'done':''}">${t.name}</div>
          <div class="t-detail">${t.detail}</div>
          <span class="t-tag" style="background:${t.tagBg};color:${t.tagColor}">${t.tag}</span>
          ${doneBy ? `<div class="t-meta">Concluído por <span class="t-who-badge" style="background:#D1FAE5;color:#065F46">${doneBy}</span></div>` : ''}
        </div>
      </div>
      <div class="task-footer">
        <div class="comments-list" id="comments-${t.id}">${commentsHtml}</div>
        <div class="add-comment">
          <textarea class="comment-input" id="ci-${t.id}" placeholder="Comentário, bug encontrado..." rows="2"></textarea>
          <button class="comment-btn" onclick="addComment('${t.id}')">Enviar</button>
        </div>
      </div>
    </div>`;
}

function renderDynamicTask(d) {
  const done = d.done || false;
  const doneBy = d.doneBy || '';
  const comments = d.comments || {};
  let commentsHtml = Object.entries(comments).map(([cid, c]) => `
    <div class="comment">
      <div class="comment-author">${c.author} · ${c.when}</div>
      ${c.text}
      ${c.author === userName ? `<button class="comment-del" onclick="delComment('${d.id}','${cid}')">×</button>` : ''}
    </div>`).join('');
  const tagColors = {Bug:['#FEE2E2','#991B1B'],Dev:['#DBEAFE','#1D4ED8'],Teste:['#D1FAE5','#065F46'],Gestão:['#FEF3C7','#92400E'],Ideia:['#F3E8FF','#7E22CE']};
  const [bg,fg] = tagColors[d.tag] || ['#F1F5F9','#475569'];
  return `
    <div class="task" id="task-${d.id}">
      <div class="task-row">
        <div class="t-chk ${done?'done':''}" onclick="toggleTask('${d.id}')">${done?'✓':''}</div>
        <div class="t-main">
          <div class="t-name ${done?'done':''}">${d.name}</div>
          ${d.detail ? `<div class="t-detail">${d.detail}</div>` : ''}
          <span class="t-tag" style="background:${bg};color:${fg}">${d.tag}</span>
          ${doneBy ? `<div class="t-meta">Concluído por <span class="t-who-badge" style="background:#D1FAE5;color:#065F46">${doneBy}</span></div>` : ''}
        </div>
      </div>
      <div class="task-footer">
        <div class="comments-list" id="comments-${d.id}">${commentsHtml}</div>
        <div class="add-comment">
          <textarea class="comment-input" id="ci-${d.id}" placeholder="Comentário, bug encontrado..." rows="2"></textarea>
          <button class="comment-btn" onclick="addComment('${d.id}')">Enviar</button>
        </div>
      </div>
    </div>`;
}

function restoreTaskStates(ph) {
  ph.weeks.forEach(w => w.tasks.forEach(t => {
    const d = allData[t.id] || {};
    const chk = document.querySelector(`#task-${t.id} .t-chk`);
    const name = document.querySelector(`#task-${t.id} .t-name`);
    if (!chk) return;
    if (d.done) { chk.classList.add('done'); chk.textContent = '✓'; }
    else { chk.classList.remove('done'); chk.textContent = ''; }
    if (name) { d.done ? name.classList.add('done') : name.classList.remove('done'); }
  }));
}

// ── TOGGLE TASK ──
async function toggleTask(taskId) {
  if (!userName) { alert('Digite seu nome primeiro!'); return; }
  const ref = db.collection(COLL).doc(taskId);
  const snap = await ref.get();
  const cur = snap.exists ? snap.data() : {};
  const newDone = !cur.done;
  await ref.set({ ...cur, done: newDone, doneBy: newDone ? userName : '', updatedAt: new Date() }, { merge: true });
  showToast(newDone ? `✅ Marcado por ${userName}!` : 'Desmarcado');
}

// ── COMMENTS ──
async function addComment(taskId) {
  if (!userName) { alert('Digite seu nome primeiro!'); return; }
  const input = document.getElementById('ci-' + taskId);
  const text = input.value.trim();
  if (!text) return;
  const ref = db.collection(COLL).doc(taskId);
  const snap = await ref.get();
  const cur = snap.exists ? snap.data() : {};
  const comments = cur.comments || {};
  const cid = 'c' + Date.now();
  const now = new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  comments[cid] = { text, author: userName, when: now };
  await ref.set({ ...cur, comments }, { merge: true });
  input.value = '';
  showToast('💬 Comentário salvo!');
}

async function delComment(taskId, cid) {
  const ref = db.collection(COLL).doc(taskId);
  const snap = await ref.get();
  if (!snap.exists) return;
  const cur = snap.data();
  const comments = cur.comments || {};
  delete comments[cid];
  await ref.set({ ...cur, comments }, { merge: true });
}

// ── ADD TASK ──
function showAddTask(phId) {
  document.getElementById('add-form-' + phId).style.display = 'block';
}
function hideAddTask(phId) {
  document.getElementById('add-form-' + phId).style.display = 'none';
}
async function addTask(phId) {
  if (!userName) { alert('Digite seu nome primeiro!'); return; }
  const name = document.getElementById('new-task-name-' + phId).value.trim();
  const detail = document.getElementById('new-task-detail-' + phId).value.trim();
  const tag = document.getElementById('new-task-tag-' + phId).value;
  if (!name) return;
  const id = 'dyn_' + Date.now();
  await db.collection(COLL).doc(id).set({
    id, type:'task', phaseId: phId, name, detail, tag,
    done: false, doneBy: '', comments: {},
    createdBy: userName, createdAt: new Date()
  });
  hideAddTask(phId);
  showToast('✅ Tarefa adicionada!');
}

// ── STATS ──
function updateStats() {
  let total = 0, done = 0, bugCount = 0;
  document.querySelectorAll('.t-chk').forEach(el => {
    total++;
    if (el.classList.contains('done')) done++;
  });
  document.querySelectorAll('.comment').forEach(() => bugCount++);
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('s-pct').textContent = pct + '%';
  document.getElementById('s-done').textContent = done + '/' + total;
  document.getElementById('s-bugs').textContent = bugCount;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-txt').textContent = done + ' de ' + total + ' tarefas';
}

// ── TOGGLE PHASE ──
function togglePhase(id) {
  const body = document.getElementById('body-' + id);
  const arrow = document.getElementById('arrow-' + id);
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

// ── NAME ──
function saveName() {
  const val = document.getElementById('who-input').value.trim();
  if (!val) return;
  userName = val;
  localStorage.setItem('crono_name', val);
  document.getElementById('who-bar').style.display = 'none';
  showToast('👋 Bem-vindo, ' + val + '!');
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── FIREBASE LISTENER ──
db.collection(COLL).onSnapshot(snap => {
  snap.forEach(doc => { allData[doc.id] = { id: doc.id, ...doc.data() }; });
  snap.docChanges().forEach(change => {
    if (change.type === 'removed') delete allData[change.doc.id];
  });
  render();
});

// ── ONLINE COUNT (simples via Firestore presence) ──
const presenceId = 'presence_' + Math.random().toString(36).substr(2,6);
db.collection(COLL + '_presence').doc(presenceId).set({ name: userName || 'anônimo', at: new Date() });
setInterval(async () => {
  const snap = await db.collection(COLL + '_presence').get();
  const recent = snap.docs.filter(d => {
    const at = d.data().at && d.data().at.toDate ? d.data().at.toDate() : null;
    return at && (Date.now() - at.getTime()) < 60000;
  });
  document.getElementById('online-lbl').textContent = recent.length + ' online agora';
  db.collection(COLL + '_presence').doc(presenceId).set({ name: userName || 'anônimo', at: new Date() });
}, 30000);

// Init
if (userName) {
  document.getElementById('who-bar').style.display = 'none';
} else {
  document.getElementById('who-input').focus();
}
</script>
